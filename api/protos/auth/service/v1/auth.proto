syntax = "proto3";

package api.auth.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "base-server/api/gen/go/auth/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.auth.service.v1";

service AuthService {
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/auth-api/v1/login"
      body: "*"
    };
  }

  rpc GetAccessCodes(google.protobuf.Empty) returns (GetAccessCodesReply) {
    option (google.api.http) = {
      get: "/auth-api/v1/access-codes"
    };
  }

  rpc CheckAuthorization(CheckAuthorizationRequest) returns (CheckAuthorizationReply);

  rpc GetWalkRoute(google.protobuf.Empty) returns (GetWalkRouteReply);

  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/auth-api/v1/logout"
      body: "*"
    };
  }

  rpc RefreshToken(google.protobuf.Empty) returns (LoginReply) {
    option (google.api.http) = {
      post: "/auth-api/v1/refresh"
      body: "*"
    };
  }

  rpc RegisterPermissionSnapshot(RegisterPermissionSnapshotRequest) returns (google.protobuf.Empty);

  rpc ApplyRoleDelta(ApplyRoleDeltaRequest) returns (google.protobuf.Empty);

  rpc ApplyApiDelta(ApplyApiDeltaRequest) returns (google.protobuf.Empty);

  rpc ApplyUserRoleBindingDelta(ApplyUserRoleBindingDeltaRequest) returns (google.protobuf.Empty);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string user_id = 1;
  string accessToken = 2;
  string refreshToken = 3;
  string session_id = 4;
}

message GetAccessCodesReply {
  repeated string access_code_list = 1;
}

message CheckAuthorizationRequest {
  string user_id = 1;
  string path = 2;
  string method = 3;
  string service = 4;
  string scope_id = 5;
  string resource_group = 7;
  string action = 8;
}

message CheckAuthorizationReply {
  bool allowed = 1;
}

message WalkRouteItem {
  string url = 1;
  string method = 2;
}

message GetWalkRouteReply {
  repeated WalkRouteItem items = 1;
}

message PolicyRoleResource {
  string id = 1;
  string type = 2;
  string value = 3;
  string method = 4;
}

message PolicyRole {
  int64 id = 1;
  string name = 2;
  string value = 3;
  bool status = 4;
  string remark = 5;
  repeated int32 menu_ids = 6;
  repeated PolicyRoleResource resources = 7;
  string service = 8;
}

message PolicyApi {
  string id = 1;
  string path = 2;
  string method = 3;
  string description = 4;
  string module = 5;
  string module_description = 6;
  string resources_group = 7;
  string service = 8;
}

message PolicyUserRoleBinding {
  string id = 1;
  string user_id = 2;
  int64 role_id = 3;
  string role_value = 4;
  string create_time = 5;
  string update_time = 6;
  string service = 7;
  string scope_id = 8;
}

message RegisterPermissionSnapshotRequest {
  string source_service = 1;
  uint64 revision = 2;
  repeated PolicyRole roles = 3;
  repeated PolicyApi apis = 4;
  repeated PolicyUserRoleBinding bindings = 5;
}

message ApplyRoleDeltaRequest {
  string source_service = 1;
  uint64 revision = 2;
  PolicyRole before = 3;
  PolicyRole after = 4;
}

message ApplyApiDeltaRequest {
  string source_service = 1;
  uint64 revision = 2;
  PolicyApi before = 3;
  PolicyApi after = 4;
}

message ApplyUserRoleBindingDeltaRequest {
  string source_service = 1;
  uint64 revision = 2;
  PolicyUserRoleBinding before = 3;
  PolicyUserRoleBinding after = 4;
}
