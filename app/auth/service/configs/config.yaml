server:
  http:
    addr: 0.0.0.0:8020
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9020
    timeout: 1s
data:
  database:
    driver: pgx
    source: postgresql://postgres:postgres.666@127.0.0.1:25432/auth?sslmode=disable
  redis:
    addr: 127.0.0.1:26379
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  service_key: auth-service
  api_key: auth-service-secret
  whitelist:
    - /api.auth.service.v1.AuthService/Login
    - /api.auth.service.v1.AuthService/Logout
    - /api.auth.service.v1.AuthService/RegisterPermissionSnapshot
    - /api.auth.service.v1.AuthService/ApplyRoleDelta
    - /api.auth.service.v1.AuthService/ApplyApiDelta
    - /api.auth.service.v1.AuthService/ApplyUserRoleBindingDelta
services:
  user:
    grpc_endpoint: 127.0.0.1:9010
logger:
  level: info
  filename: logs/auth-service.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: false
