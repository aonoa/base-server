syntax = "proto3";

package base_server.gateway.middleware.jwt.v1;

option go_package = "base-server/app/gateway/service/internal/middleware/jwt/v1;jwtv1";

message JWT {
  string signing_key = 1;
  repeated WhitelistRule whitelist = 2;
}

message WhitelistRule {
  string path = 1;
  string method = 2;
  string host = 3;
}
