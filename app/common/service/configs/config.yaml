server:
  http:
    addr: 0.0.0.0:8040
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9040
    timeout: 1s
data:
  database:
    driver: pgx
    source: postgresql://postgres:postgres.666@127.0.0.1:25432/common?sslmode=disable
  redis:
    addr: 127.0.0.1:26379
    read_timeout: 0.2s
    write_timeout: 0.2s
llm:
  agent:
    openAI:
      model: gpt-4o-mini
      api_base_url: ""
      api_key: ""
auth:
  api_key: auth-service-secret
  whitelist: []
services:
  user:
    grpc_endpoint: 127.0.0.1:9010
  admin:
    grpc_endpoint: 127.0.0.1:9030
logger:
  level: info
  filename: logs/common-service.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: false
