server:
  http:
    addr: 0.0.0.0:8030
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9030
    timeout: 1s
data:
  database:
    driver: pgx
    source: postgresql://postgres:postgres.666@postgres:5432/admin?sslmode=disable
  redis:
    addr: redis:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  api_key: auth-service-secret
  whitelist:
    - /api.admin.service.v1.AdminService/CreateSysLog
services:
  user:
    grpc_endpoint: user:9010
  auth:
    grpc_endpoint: auth:9020
  common:
    grpc_endpoint: common:9040
