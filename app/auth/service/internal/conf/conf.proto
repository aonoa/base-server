syntax = "proto3";
package kratos.api;

option go_package = "base-server/app/auth/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Services services = 4;
  Logger logger = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Auth {
  string service_key = 1;
  string api_key = 2;
  repeated string whitelist = 3;
}

message Services {
  message User {
    string grpc_endpoint = 1;
  }
  User user = 1;
}

message Logger {
  string level = 1;
  string filename = 2;
  int32 max_size = 3;
  int32 max_backups = 4;
  int32 max_age = 5;
  bool compress = 6;
}
