syntax = "proto3";

package api.admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "base-server/api/gen/go/admin/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.admin.service.v1";

service AdminService {
  rpc GetRoleList(RolePageParams) returns (GetRoleListByPageReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/roles"
    };
  }

  rpc AddRole(RoleListItem) returns (RoleListItem) {
    option (google.api.http) = {
      post: "/admin-api/v1/roles"
      body: "*"
    };
  }

  rpc UpdateRole(RoleListItem) returns (RoleListItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/roles/{id}"
      body: "*"
    };
  }

  rpc DelRole(DeleteRole) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/roles/{id}"
    };
  }

  rpc GetApiList(GetApiPageParams) returns (GetApiListByPageReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/apis"
    };
  }

  rpc AddApi(ApiListItem) returns (ApiListItem) {
    option (google.api.http) = {
      post: "/admin-api/v1/apis"
      body: "*"
    };
  }

  rpc UpdateApi(ApiListItem) returns (ApiListItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/apis/{id}"
      body: "*"
    };
  }

  rpc DelApi(DeleteApi) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/apis/{id}"
    };
  }

  rpc GetResourceList(GetResourcePageParams) returns (GetResourceListByPageReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/resources"
    };
  }

  rpc AddResource(ResourceListItem) returns (ResourceListItem) {
    option (google.api.http) = {
      post: "/admin-api/v1/resources"
      body: "*"
    };
  }

  rpc UpdateResource(ResourceListItem) returns (ResourceListItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/resources/{id}"
      body: "*"
    };
  }

  rpc DelResource(DeleteResource) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/resources/{id}"
    };
  }

  rpc GetAuthRoleCatalog(google.protobuf.Empty) returns (GetAuthRoleCatalogReply);

  rpc GetAuthApiCatalog(google.protobuf.Empty) returns (GetAuthApiCatalogReply);

  rpc GetAuthRole(GetAuthRoleRequest) returns (AuthRoleItem);

  rpc ResolveRoleValues(ResolveRoleValuesRequest) returns (ResolveRoleValuesReply);

  rpc GetUserRoleBinding(GetUserRoleBindingRequest) returns (UserRoleBindingItem) {
    option (google.api.http) = {
      get: "/admin-api/v1/user-role-bindings/{user_id}"
    };
  }

  rpc ListUserRoleBindings(google.protobuf.Empty) returns (ListUserRoleBindingsReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/user-role-bindings"
    };
  }

  rpc UpsertUserRoleBinding(UserRoleBindingItem) returns (UserRoleBindingItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/user-role-bindings/{user_id}"
      body: "*"
    };
  }

  rpc DeleteUserRoleBinding(DeleteUserRoleBindingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/user-role-bindings/{user_id}"
    };
  }

  rpc GetUserDeptBinding(GetUserDeptBindingRequest) returns (UserDeptBindingItem) {
    option (google.api.http) = {
      get: "/admin-api/v1/user-dept-bindings/{user_id}"
    };
  }

  rpc UpsertUserDeptBinding(UserDeptBindingItem) returns (UserDeptBindingItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/user-dept-bindings/{user_id}"
      body: "*"
    };
  }

  rpc DeleteUserDeptBinding(DeleteUserDeptBindingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/user-dept-bindings/{user_id}"
    };
  }

  rpc GetOrganizationList(GetOrganizationListParams) returns (GetOrganizationListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/organizations"
    };
  }

  rpc AddOrganization(OrganizationItem) returns (OrganizationItem) {
    option (google.api.http) = {
      post: "/admin-api/v1/organizations"
      body: "*"
    };
  }

  rpc UpdateOrganization(OrganizationItem) returns (OrganizationItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/organizations/{id}"
      body: "*"
    };
  }

  rpc DelOrganization(DeleteOrganization) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/organizations/{id}"
    };
  }

  rpc GetOrganizationMembers(GetOrganizationMembersRequest) returns (GetOrganizationMembersReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/organizations/{organization_id}/members"
    };
  }

  rpc SaveOrganizationMembers(SaveOrganizationMembersRequest) returns (GetOrganizationMembersReply) {
    option (google.api.http) = {
      put: "/admin-api/v1/organizations/{organization_id}/members"
      body: "*"
    };
  }

  rpc GetOrganizationPermissionScope(GetOrganizationPermissionScopeRequest) returns (OrganizationPermissionScopeReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/organizations/{organization_id}/permission-scope"
    };
  }

  rpc SaveOrganizationPermissionScope(SaveOrganizationPermissionScopeRequest) returns (OrganizationPermissionScopeReply) {
    option (google.api.http) = {
      put: "/admin-api/v1/organizations/{organization_id}/permission-scope"
      body: "*"
    };
  }

  rpc GetCurrentPermissionCatalog(google.protobuf.Empty) returns (OrganizationPermissionCatalogReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/permission-catalog/current"
    };
  }

  rpc GetOrganizationPermissionCatalog(GetOrganizationPermissionCatalogRequest) returns (OrganizationPermissionCatalogReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/organizations/{organization_id}/permission-catalog"
    };
  }

  rpc GetMyOrganizations(google.protobuf.Empty) returns (GetMyOrganizationsReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/my/organizations"
    };
  }

  rpc SwitchCurrentOrganization(SwitchCurrentOrganizationRequest) returns (CurrentOrganizationReply) {
    option (google.api.http) = {
      put: "/admin-api/v1/my/current-organization"
      body: "*"
    };
  }

  rpc GetDeptList(GetDeptListParams) returns (GetDeptListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/depts"
    };
  }

  rpc AddDept(DeptListItem) returns (DeptListItem) {
    option (google.api.http) = {
      post: "/admin-api/v1/depts"
      body: "*"
    };
  }

  rpc UpdateDept(DeptListItem) returns (DeptListItem) {
    option (google.api.http) = {
      put: "/admin-api/v1/depts/{id}"
      body: "*"
    };
  }

  rpc DelDept(DeleteDept) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/depts/{id}"
    };
  }

  rpc GetCurrentUserMenus(google.protobuf.Empty) returns (GetCurrentUserMenusReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/menus/current"
    };
  }

  rpc GetSysMenuList(MenuParams) returns (GetSysMenuListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/menus"
    };
  }

  rpc ListMenus(google.protobuf.Empty) returns (ListMenusReply);

  rpc GetWalkRoute(google.protobuf.Empty) returns (GetWalkRouteReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/walk-routes"
    };
  }

  rpc GetSelfWalkRoute(google.protobuf.Empty) returns (GetWalkRouteReply);

  rpc IsMenuNameExists(IsMenuNameExistsRequest) returns (IsMenuNameExistsReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/menus/name-exists"
    };
  }

  rpc IsMenuPathExists(IsMenuPathExistsRequest) returns (IsMenuPathExistsReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/menus/path-exists"
    };
  }

  rpc CreateMenu(SysMenuListItem) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin-api/v1/menus"
      body: "*"
    };
  }

  rpc UpdateMenu(SysMenuListItem) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin-api/v1/menus/{id}"
      body: "*"
    };
  }

  rpc DeleteMenu(DeleteMenuRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin-api/v1/menus/{id}"
    };
  }

  rpc GetServiceRegistryList(google.protobuf.Empty) returns (GetServiceRegistryListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/platform/services"
    };
  }

  rpc GetProjectionSourceStatusList(google.protobuf.Empty) returns (GetProjectionSourceStatusListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/platform/projection-sources"
    };
  }

  rpc CreateSysLog(CreateSysLogRequest) returns (google.protobuf.Empty);

  rpc GetSysLogList(GetSysLogListParams) returns (GetSysLogListReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/logs"
    };
  }

  rpc GetSysLogInfo(GetSysLogInfoParams) returns (GetSysLogInfoReply) {
    option (google.api.http) = {
      get: "/admin-api/v1/logs/{id}"
    };
  }
}

message GetOrganizationListParams {
  int64 current_page = 1;
  int64 page_size = 2;
  string name = 3;
  string code = 4;
  int32 status = 5;
}

message OrganizationItem {
  string id = 1;
  string name = 2;
  string code = 3;
  int32 order_no = 4;
  string remark = 5;
  int32 status = 6;
  string create_time = 7;
  string update_time = 8;
  int64 member_count = 9;
  int64 dept_count = 10;
}

message GetOrganizationListReply {
  repeated OrganizationItem items = 1;
  int64 total = 2;
  bool can_manage_organizations = 3;
}

message DeleteOrganization {
  string id = 1;
}

message GetOrganizationMembersRequest {
  string organization_id = 1;
}

message OrganizationMemberItem {
  string user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string avatar = 5;
  int32 user_status = 6;
  int32 member_status = 7;
  bool primary = 8;
  string create_time = 9;
}

message GetOrganizationMembersReply {
  repeated OrganizationMemberItem items = 1;
  int64 total = 2;
}

message SaveOrganizationMembersRequest {
  string organization_id = 1;
  repeated string user_ids = 2;
}

message GetOrganizationPermissionScopeRequest {
  string organization_id = 1;
}

message SaveOrganizationPermissionScopeRequest {
  string organization_id = 1;
  repeated int32 menu_ids = 2;
  repeated string resource_ids = 3;
}

message OrganizationPermissionScopeReply {
  string organization_id = 1;
  repeated int32 menu_ids = 2;
  repeated string resource_ids = 3;
}

message GetOrganizationPermissionCatalogRequest {
  string organization_id = 1;
}

message OrganizationPermissionCatalogReply {
  string organization_id = 1;
  repeated SysMenuListItem menus = 2;
  repeated ResourceListItem resources = 3;
  repeated int32 scoped_menu_ids = 4;
  repeated string scoped_resource_ids = 5;
}

message MyOrganizationItem {
  string id = 1;
  string name = 2;
  string code = 3;
  int32 order_no = 4;
  string remark = 5;
  int32 status = 6;
  bool current = 7;
  string create_time = 8;
  string update_time = 9;
}

message GetMyOrganizationsReply {
  repeated MyOrganizationItem items = 1;
  string current_organization_id = 2;
}

message SwitchCurrentOrganizationRequest {
  string organization_id = 1;
}

message CurrentOrganizationReply {
  MyOrganizationItem current = 1;
  string current_organization_id = 2;
}

message GetDeptListParams {
  string organization_id = 1;
}

message DeptListItem {
  reserved 9;

  string id = 1;
  string pid = 2;
  string name = 3;
  int32 order_no = 4;
  string remark = 5;
  int32 status = 6;
  string create_time = 7;
  repeated DeptListItem children = 10;
  string organization_id = 11;
}

message DeleteDept {
  string id = 1;
}

message GetDeptListReply {
  repeated DeptListItem items = 1;
  int64 total = 2;
}

message RolePageParams {
  int64 current_page = 1;
  int64 page_size = 2;
  string name = 3;
  int64 status = 4;
  string dept_id = 5;
  string organization_id = 6;
}

message RoleListItem {
  string id = 1;
  string name = 2;
  string value = 3;
  int32 status = 4;
  string order_no = 5;
  string create_time = 6;
  string remark = 7;
  repeated int32 permissions = 8;
  string dept = 9;
  repeated string api_permissions = 10;
  string organization_id = 11;
  string data_scope = 12;
  repeated int64 data_scope_dept_ids = 13;
}

message GetRoleListByPageReply {
  repeated RoleListItem items = 1;
  int64 total = 2;
}

message DeleteRole {
  string id = 1;
}

message GetApiPageParams {
  int64 current_page = 1;
  int64 page_size = 2;
  string path = 3;
  string description = 4;
  string method = 5;
  string resources_group = 6;
}

message ApiListItem {
  string id = 1;
  string path = 2;
  string method = 3;
  string description = 4;
  string module = 5;
  string module_description = 6;
  string resources_group = 7;
}

message GetApiListByPageReply {
  repeated ApiListItem items = 1;
  int64 total = 2;
}

message DeleteApi {
  string id = 1;
}

message GetResourcePageParams {
  int64 current_page = 7;
  int64 page_size = 8;
  string name = 2;
  string type = 3;
  string value = 4;
  string method = 5;
  string description = 6;
}

message ResourceListItem {
  string id = 1;
  string name = 2;
  string type = 3;
  string value = 4;
  string method = 5;
  string description = 6;
}

message GetResourceListByPageReply {
  repeated ResourceListItem items = 1;
  int64 total = 2;
}

message DeleteResource {
  string id = 1;
}

message AuthRoleResourceItem {
  string id = 1;
  string type = 2;
  string value = 3;
  string method = 4;
}

message AuthRoleItem {
  int64 id = 1;
  string name = 2;
  string value = 3;
  bool status = 4;
  string remark = 5;
  repeated int32 menu_ids = 6;
  repeated AuthRoleResourceItem resources = 7;
}

message GetAuthRoleCatalogReply {
  repeated AuthRoleItem items = 1;
}

message AuthApiItem {
  string id = 1;
  string path = 2;
  string method = 3;
  string description = 4;
  string module = 5;
  string module_description = 6;
  string resources_group = 7;
}

message GetAuthApiCatalogReply {
  repeated AuthApiItem items = 1;
}

message GetAuthRoleRequest {
  int64 id = 1;
}

message ResolveRoleValuesRequest {
  repeated int64 role_ids = 1;
}

message ResolveRoleValueItem {
  int64 role_id = 1;
  string value = 2;
}

message ResolveRoleValuesReply {
  repeated ResolveRoleValueItem items = 1;
}

message GetUserRoleBindingRequest {
  string user_id = 1;
  string organization_id = 2;
}

message UserRoleBindingItem {
  string id = 1;
  string user_id = 2;
  int64 role_id = 3;
  string create_time = 4;
  string update_time = 5;
  repeated int64 role_ids = 6;
  string organization_id = 7;
}

message ListUserRoleBindingsReply {
  repeated UserRoleBindingItem items = 1;
}

message DeleteUserRoleBindingRequest {
  string user_id = 1;
  string organization_id = 2;
}

message GetUserDeptBindingRequest {
  string user_id = 1;
  string organization_id = 2;
}

message UserDeptBindingItem {
  string id = 1;
  string user_id = 2;
  string dept_id = 3;
  string dept_name = 4;
  string create_time = 5;
  string update_time = 6;
  string organization_id = 7;
}

message DeleteUserDeptBindingRequest {
  string user_id = 1;
  string organization_id = 2;
}

message MenuParams {
  string menu_name = 1;
  string status = 2;
}

message Meta {
  int64 order = 1;
  string icon = 2;
  string title = 3;
  optional string activeIcon = 4;
  optional string activePath = 5;
  optional bool affixTab = 6;
  optional int64 affixTabOrder = 7;
  optional string badge = 8;
  optional string badgeType = 9;
  optional string badgeVariants = 10;
  optional bool hideChildrenInMenu = 11;
  optional bool hideInBreadcrumb = 12;
  optional bool hideInMenu = 13;
  optional bool hideInTab = 14;
  optional string iframeSrc = 15;
  optional string link = 16;
  optional bool keepAlive = 17;
  optional int64 maxNumOfOpenTab = 18;
  optional bool noBasicLayout = 19;
  optional bool openInNewWindow = 20;
  bool ignoreAccess = 21;
  repeated string authority = 22;
}

message SysMenuListItem {
  int32 id = 1;
  string component = 2;
  optional int32 status = 3;
  string authCode = 4;
  string name = 5;
  string path = 6;
  int64 pid = 7;
  optional string redirect = 8;
  string type = 9;
  Meta meta = 10;
  repeated SysMenuListItem children = 11;
  string create_time = 12;
}

message GetSysMenuListReply {
  repeated SysMenuListItem items = 1;
  int64 total = 2;
}

message CurrentUserMenuItem {
  int32 id = 1;
  string component = 2;
  optional int32 status = 3;
  string authCode = 4;
  string name = 5;
  string path = 6;
  int64 pid = 7;
  optional string redirect = 8;
  string type = 9;
  Meta meta = 10;
  repeated CurrentUserMenuItem children = 11;
  string create_time = 12;
}

message GetCurrentUserMenusReply {
  repeated CurrentUserMenuItem items = 1;
}

message MenuRecord {
  int32 id = 1;
  string component = 2;
  optional int32 status = 3;
  string authCode = 4;
  string name = 5;
  string path = 6;
  int64 pid = 7;
  optional string redirect = 8;
  string type = 9;
  Meta meta = 10;
  string create_time = 11;
}

message ListMenusReply {
  repeated MenuRecord items = 1;
}

message WalkRouteItem {
  string url = 1;
  string method = 2;
}

message GetWalkRouteReply {
  repeated WalkRouteItem items = 1;
}

message IsMenuNameExistsRequest {
  int64 id = 1;
  string name = 2;
}

message IsMenuNameExistsReply {
  bool data = 1;
}

message IsMenuPathExistsRequest {
  int64 id = 1;
  string path = 2;
}

message IsMenuPathExistsReply {
  bool data = 1;
}

message DeleteMenuRequest {
  int64 id = 1;
}

message ServiceRegistryItem {
  string id = 1;
  string service_code = 2;
  string service_name = 3;
  string http_prefix = 5;
  string grpc_service = 6;
  int32 status = 7;
  bool projection_enabled = 8;
  string description = 9;
  string create_time = 10;
}

message GetServiceRegistryListReply {
  repeated ServiceRegistryItem items = 1;
  int64 total = 2;
}

message ProjectionSourceStatusItem {
  string id = 1;
  string source_service = 2;
  string sync_mode = 4;
  string state = 5;
  uint64 last_snapshot_revision = 6;
  string last_sync_time = 7;
  string last_error = 8;
  string description = 9;
  string create_time = 10;
}

message GetProjectionSourceStatusListReply {
  repeated ProjectionSourceStatusItem items = 1;
  int64 total = 2;
}

message CreateSysLogRequest {
  string user_id = 1;
  string user_name = 2;
  bool is_login = 3;
  string session_id = 4;
  string method = 5;
  string path = 6;
  string request_time = 7;
  string ip_address = 8;
  string ip_location = 9;
  int64 latency = 10;
  string os = 11;
  string browser = 12;
  string user_agent = 13;
  string header = 14;
  string get_params = 15;
  string post_data = 16;
  int32 res_code = 17;
  string reason = 18;
  bool res_status = 19;
  string stack = 20;
}

message GetSysLogListParams {
  int64 current_page = 20;
  int64 page_size = 21;
  string user_id = 2;
  string user_name = 3;
  bool is_login = 4;
  string session_id = 5;
  string method = 6;
  string path = 7;
  string request_time_start = 8;
  string request_time_end = 9;
  string ip_address = 10;
  int64 latency = 11;
  int32 res_code = 17;
  bool res_status = 19;
}

message SysLogItem {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string method = 5;
  string path = 6;
  string request_time = 7;
  string ip_address = 8;
  string ip_location = 9;
  int64 latency = 10;
  string os = 11;
  string browser = 12;
  int32 res_code = 17;
  bool res_status = 19;
}

message GetSysLogListReply {
  repeated SysLogItem items = 1;
  int64 total = 2;
}

message GetSysLogInfoParams {
  string id = 1;
}

message GetSysLogInfoReply {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  bool is_login = 4;
  string session_id = 5;
  string method = 6;
  string path = 7;
  string request_time = 8;
  string ip_address = 9;
  string ip_location = 10;
  int64 latency = 11;
  string os = 12;
  string browser = 13;
  string user_agent = 14;
  string header = 15;
  string get_params = 16;
  string post_data = 17;
  int32 res_code = 18;
  string reason = 19;
  bool res_status = 20;
  string stack = 21;
  string create_time = 22;
}
