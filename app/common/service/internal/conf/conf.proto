syntax = "proto3";
package kratos.api;

option go_package = "base-server/app/common/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Llm llm = 3;
  Auth auth = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Llm {
  message Agent {
    message OpenAI {
      string model = 1;
      string api_base_url = 2;
      string api_key = 3;
    }
    OpenAI openAI = 1;
  }
  Agent agent = 1;
}

message Auth {
  string api_key = 1;
  repeated string whitelist = 2;
}
