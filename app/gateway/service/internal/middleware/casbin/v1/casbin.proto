syntax = "proto3";

package base_server.gateway.middleware.casbin.v1;

option go_package = "base-server/app/gateway/service/internal/middleware/casbin/v1;casbinv1";

message Casbin {
  string signing_key = 1;
  repeated WhitelistRule whitelist = 2;
}

message WhitelistRule {
  string path = 1;
  string method = 2;
  string host = 3;
}
